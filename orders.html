<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Orders | The Indian Garden Nursery</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link rel="stylesheet" href="styles.css">
    <style>
        body { background: #f3f3f3; }
        .orders-page { max-width: 1000px; margin: 0 auto; padding: 40px 20px; }
        .orders-header { margin-bottom: 30px; text-align: center; }
        .orders-header h1 { font-family: 'Outfit', sans-serif; font-size: 2.2rem; color: var(--primary); margin-bottom: 10px; }
        .orders-header p { color: var(--text-muted); font-size: 1.1rem; }
        
        .order-card { background: #fff; border-radius: 12px; box-shadow: 0 2px 12px rgba(0,0,0,0.07); margin-bottom: 25px; overflow: hidden; }
        .order-header { background: #f9f9f9; padding: 15px 25px; border-bottom: 1px solid #eee; display: flex; justify-content: space-between; align-items: center; }
        .order-header-info div { font-size: 0.9rem; color: var(--text-muted); margin-bottom: 4px; }
        .order-header-info strong { color: var(--text-dark); font-family: 'Outfit', sans-serif; }
        .order-status { padding: 6px 14px; border-radius: 50px; font-weight: 700; font-size: 0.85rem; }
        .status-0 { background: #fff3e0; color: #ef6c00; } /* Placed */
        .status-1 { background: #e3f2fd; color: #1565c0; } /* Confirmed */
        .status-2 { background: #f3e5f5; color: #6a1b9a; } /* Packed */
        .status-3 { background: #e8f5e9; color: #2e7d32; } /* Shipped */
        .status-4 { background: #e0f2f1; color: #00695c; } /* Delivered */
        .status--1 { background: #ffebee; color: #c62828; } /* Cancelled */

        .order-body { padding: 25px; }
        .order-item { display: flex; gap: 15px; margin-bottom: 15px; align-items: center; border-bottom: 1px solid #f5f5f5; padding-bottom: 15px; }
        .order-item:last-child { border-bottom: none; padding-bottom: 0; margin-bottom: 0; }
        .order-item img { width: 70px; height: 70px; object-fit: cover; border-radius: 8px; }
        .order-item-details { flex: 1; }
        .order-item-name { font-weight: 700; font-size: 1.05rem; color: var(--text-dark); margin-bottom: 5px; }
        .order-item-meta { font-size: 0.9rem; color: var(--text-muted); }
        .order-item-price { font-weight: 700; color: var(--primary); }

        .order-footer { padding: 15px 25px; border-top: 1px solid #eee; display: flex; justify-content: space-between; align-items: center; background: #fafafa; }
        .order-total { font-size: 1.1rem; color: var(--text-dark); }
        .order-total strong { font-size: 1.3rem; color: var(--primary); font-family: 'Outfit', sans-serif; }
        .cancel-btn { background: none; border: 1px solid #e53935; color: #e53935; padding: 8px 16px; border-radius: 6px; cursor: pointer; font-weight: 600; font-size: 0.9rem; transition: all 0.2s; }
        .cancel-btn:hover { background: #e53935; color: #fff; }

        .empty-orders { text-align: center; padding: 60px 20px; background: #fff; border-radius: 12px; box-shadow: 0 2px 12px rgba(0,0,0,0.07); }
        .empty-orders i { font-size: 4rem; color: #ddd; margin-bottom: 20px; }
        .empty-orders h2 { color: var(--text-dark); font-family: 'Outfit', sans-serif; margin-bottom: 10px; }
        .empty-orders p { color: var(--text-muted); margin-bottom: 20px; }
        .btn-primary { display: inline-block; padding: 12px 25px; background: var(--primary); color: #fff; text-decoration: none; border-radius: 8px; font-weight: 600; transition: background 0.2s; }
        .btn-primary:hover { background: var(--primary-dark); }

    </style>

    <!-- ===== VERCEL WEB ANALYTICS ===== -->
    <script>
        window.va = window.va || function () { (window.vaq = window.vaq || []).push(arguments); };
    </script>
    <script defer src="/_vercel/insights/script.js"></script>
</head>
<body>
    <nav id="navbar" class="scrolled">
        <div class="nav-inner">
            <div class="logo">
                <a href="index.html" style="display:flex;align-items:center;gap:12px;text-decoration:none;">
                    <img src="logo.png" alt="The Indian Garden Nursery Logo">
                    <div class="logo-text">
                        <span>The Indian Garden Nursery</span>
                        <span>Direct from Farm</span>
                    </div>
                </a>
            </div>
            <ul class="nav-links">
                <li><a href="index.html"><i class="fas fa-home"></i> Home</a></li>
                <li><a href="index.html#inventory">Shop Plants</a></li>
                <li><a href="cart.html"><i class="fas fa-shopping-cart"></i> Cart <span class="cart-badge" style="display:none;">0</span></a></li>
                <li><a href="tel:+919885533297" class="nav-phone"><i class="fas fa-phone-alt"></i> <span>Call Us</span></a></li>
            </ul>
        </div>
    </nav>

    <div class="orders-page">
        <div class="orders-header">
            <h1><i class="fas fa-box-open"></i> My Orders</h1>
            <p>Track and manage your plant orders</p>
        </div>

        <div id="ordersList"></div>
    </div>

    <script src="cart.js"></script>
    <script>
        const statusMap = {
            0: { label: 'Order Placed', class: 'status-0' },
            1: { label: 'Confirmed', class: 'status-1' },
            2: { label: 'Packed', class: 'status-2' },
            3: { label: 'Shipped', class: 'status-3' },
            4: { label: 'Delivered', class: 'status-4' },
            '-1': { label: 'Cancelled', class: 'status--1' }
        };

        function formatDate(isoString) {
            const d = new Date(isoString);
            return d.toLocaleDateString('en-IN', { day: 'numeric', month: 'short', year: 'numeric', hour: '2-digit', minute: '2-digit' });
        }

        function renderOrders() {
            const orders = Cart.getOrders();
            const container = document.getElementById('ordersList');

            if (orders.length === 0) {
                container.innerHTML = \`
                    <div class="empty-orders">
                        <i class="fas fa-clipboard-list"></i>
                        <h2>No orders found</h2>
                        <p>Looks like you haven't placed any orders yet.</p>
                        <a href="index.html#inventory" class="btn-primary">Browse Plants</a>
                    </div>
                \`;
                return;
            }

            container.innerHTML = orders.map(order => \`
                <div class="order-card" id="order-\${order.id}">
                    <div class="order-header">
                        <div class="order-header-info">
                            <div>Order ID: <strong>\${order.id}</strong></div>
                            <div>Placed on: \${formatDate(order.date)}</div>
                            <div style="margin-top:5px; font-size:0.85rem;"><i class="fas fa-map-marker-alt" style="color:var(--primary);"></i> \${order.address}</div>
                        </div>
                        <div class="order-status \${statusMap[order.status]?.class || 'status-0'}">
                            \${statusMap[order.status]?.label || 'Unknown'}
                        </div>
                    </div>
                    <div class="order-body">
                        \${order.items.map(item => \`
                            <div class="order-item">
                                <img src="\${item.img}" alt="\${item.name}" onerror="this.src='logo.jpg'">
                                <div class="order-item-details">
                                    <div class="order-item-name">\${item.name}</div>
                                    <div class="order-item-meta">Qty: \${item.qty} | ₹\${item.price}/each</div>
                                </div>
                                <div class="order-item-price">₹\${item.qty * item.price}</div>
                            </div>
                        \`).join('')}
                    </div>
                    <div class="order-footer">
                        <div class="order-total">
                            Total Paid/Payable (\${order.payment}): <strong>₹\${order.total}</strong>
                        </div>
                        \${order.status === 0 ? \`<button class="cancel-btn" onclick="cancelOrder('\${order.id}')">Cancel Order</button>\` : ''}
                    </div>
                </div>
            \`).join('');
        }

        function cancelOrder(id) {
            if (confirm('Are you sure you want to cancel this order?')) {
                if (Cart.cancelOrder(id)) {
                    renderOrders();
                } else {
                    alert('Order could not be cancelled.');
                }
            }
        }

        document.addEventListener('DOMContentLoaded', renderOrders);
    </script>

    <!-- FLOATING CONTACT BUTTONS -->
    <div class="floating-btns">
        <a href="https://wa.me/919885533297" class="float-btn btn-whatsapp" title="WhatsApp Order" target="_blank"><i class="fab fa-whatsapp"></i></a>
        <a href="tel:+919885533297" class="float-btn btn-call" title="Call Us (+91 98855 33297)"><i class="fas fa-phone-alt"></i></a>
    </div>

</body>
</html>
